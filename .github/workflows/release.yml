name: Toolchain Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable B committed in all nine app manifests
        required: true
        type: string
      source_sha:
        description: Immutable toolchain source SHA
        required: true
        type: string
      verify_published:
        description: Verify an already-published cohort using current validation scripts
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  # The called verifier holds the cohort lock; its caller must use a separate lock.
  group: toolchain-release-${{ inputs.version }}${{ inputs.verify_published && '-verification-dispatch' || '' }}
  cancel-in-progress: false
jobs:
  verify-published:
    if: ${{ inputs.verify_published }}
    uses: ./.github/workflows/verify-published-release.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
  validate:
    if: ${{ !inputs.verify_published }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DUSKMOON_NATIVE_MODE: source
    outputs:
      reuse_native: ${{ steps.reuse.outputs.reusable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - name: Require prior CI and source tests
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: elixir .github/scripts/check_workflow_runs.exs "$SOURCE_SHA"
      - name: Immutable complete release plan
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/main || { echo 'Release must be dispatched from main' >&2; exit 1; }
          test "$WORKFLOW_SHA" = "$SOURCE_SHA" || { echo 'Dispatch workflow ref must point at source_sha' >&2; exit 1; }
          elixir scripts/release.exs plan "$VERSION" "$SOURCE_SHA"
          elixir scripts/release.exs preflight "$VERSION" "$SOURCE_SHA"
      - name: Reuse only verified complete public native assets on retries
        id: reuse
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: elixir .github/scripts/reuse_release.exs "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/reused-native-assets"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.reuse.outputs.reusable == 'true'
        with:
          name: native-reused
          path: ${{ runner.temp }}/reused-native-assets/*.tar.gz
          if-no-files-found: error
          overwrite: true
  native:
    name: native / ${{ matrix.target }}
    needs: validate
    if: needs.validate.outputs.reuse_native != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
            use_cross: false
            quickbeam_target: 'aarch64-macos-none'
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            use_cross: false
            quickbeam_target: 'aarch64-linux-gnu'
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04
            use_cross: true
            quickbeam_target: 'aarch64-linux-musl'
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            use_cross: false
            quickbeam_target: 'x86_64-macos-none'
          - target: x86_64-pc-windows-gnu
            runner: windows-2025
            use_cross: false
            quickbeam_target: ''
          - target: x86_64-unknown-freebsd
            runner: ubuntu-26.04
            use_cross: true
            quickbeam_target: 'x86_64-freebsd-none'
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            use_cross: false
            quickbeam_target: 'x86_64-linux-gnu'
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
            use_cross: true
            quickbeam_target: 'x86_64-linux-musl'
    uses: ./.github/workflows/native-prebuild.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      use_cross: ${{ matrix.use_cross }}
      quickbeam_target: ${{ matrix.quickbeam_target }}
  stage:
    needs: [validate, native]
    if: ${{ always() && needs.validate.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.validate.outputs.reuse_native == 'true' || !contains(needs.*.result, 'skipped')) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ runner.temp }}/native-assets
      - name: Final artifact checksums and exact package tarballs
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          elixir scripts/release.exs prepare "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/native-assets" "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: exact-publish-packages
          path: ${{ runner.temp }}/packages
          include-hidden-files: true
          overwrite: true
  publish:
    needs: stage
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DUSKMOON_NATIVE_MODE: precompiled
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ runner.temp }}/native-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exact-publish-packages
          path: ${{ runner.temp }}/packages
      - name: Sign the native artifacts, exact Hex tarballs and release manifest
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/native-assets/*.tar.gz
            ${{ runner.temp }}/packages/**/*.tar
            ${{ runner.temp }}/packages/release-provenance.json
      - name: Retain the signed provenance bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-attestations
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          overwrite: true
      - name: Make immutable native artifacts publicly downloadable first
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: elixir scripts/release.exs publish-assets "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/native-assets" "$RUNNER_TEMP/packages"
      - name: Publish Hex packages in derived manifest order
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: elixir scripts/release.exs publish-packages "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/native-assets" "$RUNNER_TEMP/packages"
      - name: Record the published cohort for the independent test workflow
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          elixir -e 'File.write!(Path.join(System.fetch_env!("RUNNER_TEMP"), "release-request.json"), JSON.encode!(%{version: System.fetch_env!("VERSION"), source_sha: System.fetch_env!("SOURCE_SHA")}))'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-request
          path: ${{ runner.temp }}/release-request.json
          if-no-files-found: error
          overwrite: true
