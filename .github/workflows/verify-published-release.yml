name: Verify Published Toolchain Release
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Already-published stable B cohort version
        required: true
        type: string
      source_sha:
        description: Immutable artifact source SHA from public release provenance
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: toolchain-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/test.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
    secrets: inherit
