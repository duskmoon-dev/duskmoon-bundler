name: Optional UI Compatibility
on:
  workflow_dispatch:
    inputs:
      ui_sha:
        description: Immutable downstream UI SHA to test against this toolchain revision
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ui-compatibility-${{ github.sha }}-${{ inputs.ui_sha }}
  cancel-in-progress: true
jobs:
  candidate-ui:
    name: candidate-ui / ${{ inputs.ui_sha }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DUSKMOON_NATIVE_MODE: source
      RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: toolchain
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - name: Require an immutable UI integration revision
        env:
          UI_SHA: ${{ inputs.ui_sha }}
        run: elixir -r toolchain/.github/scripts/release_support.exs -e 'ReleaseSupport.sha!(System.fetch_env!("UI_SHA"))'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: duskmoon-dev/phoenix-duskmoon-ui
          ref: ${{ inputs.ui_sha }}
          path: ui
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          tool_versions: |
            zig 0.17.1
      - name: Select Zig patch toolchain
        shell: bash
        run: echo "ZIG_EXECUTABLE_PATH=$(command -v zig)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
      - name: Candidate closure with isolated native sources
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        working-directory: ui
        run: scripts/candidate-integration.sh "$GITHUB_WORKSPACE/toolchain"
