name: Toolchain CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: toolchain-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  DUSKMOON_NATIVE_MODE: source
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - uses: ./.github/actions/hologram-checks
  compile-compatibility:
    name: compile / Elixir ${{ matrix.elixir }} / OTP 28
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        elixir: ['1.19', '1.20']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          elixir: ${{ matrix.elixir }}
      - run: mix compile --warnings-as-errors
  workflow-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$(go env GOPATH)/bin/actionlint" -color'
  native-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - run: elixir scripts/check-native-copies.exs
      - run: elixir scripts/check-toolchain-pins.exs
      - name: Clippy for every first-party Rust crate
        run: |
          for manifest in apps/duskmoon_{oxc,oxide,vize}/native/*/Cargo.toml; do
            cargo clippy --manifest-path "$manifest" --locked -- -D warnings
          done
  native-downloads:
    name: native-downloads / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-26-intel, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '28.5.0.8'
      - name: Redirect header regressions
        run: elixir scripts/native-url-test.exs
      - name: Cold published-native consumer with candidate download callbacks
        env:
          GH_TOKEN: ${{ github.token }}
        run: elixir .github/scripts/native_download_probe.exs
