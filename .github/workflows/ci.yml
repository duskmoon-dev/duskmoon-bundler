name: Toolchain CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: toolchain-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  DUSKMOON_NATIVE_MODE: source
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - uses: ./.github/actions/hologram-checks
