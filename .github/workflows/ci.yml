name: Toolchain CI
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  DUSKMOON_NATIVE_MODE: source
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28']
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: ${{ matrix.otp }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - uses: actions/cache@v6
        with:
          path: deps
          key: ${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-glibc-source-elixir1.18-otp${{ matrix.otp }}-rust-stable-zig0.16-${{ hashFiles('mix.lock', '**/Cargo.lock') }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ github.repository }}-bun1.3.13-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Install locked toolchain dependencies
        run: |
          mix deps.get --check-locked
          bun install --frozen-lockfile
      - name: Pure release, package and native-policy contracts
        run: |
          elixir .github/scripts/release_test.exs
          elixir scripts/upgrade-ui-test.exs
          elixir scripts/package-stage-test.exs
          elixir scripts/native-policy-test.exs
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: elixir scripts/native-download-failure-test.exs
      - name: All eight apps and generic integration regressions
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MIX_ENV: test
        run: mix test
      - run: bun test test/js
