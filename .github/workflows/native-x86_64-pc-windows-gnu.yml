name: Native x86_64-pc-windows-gnu
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-target-x86_64-pc-windows-gnu-${{ inputs.version }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/native-prebuild.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
      target: x86_64-pc-windows-gnu
      runner: windows-2025
      use_cross: false
      quickbeam_target: ''
