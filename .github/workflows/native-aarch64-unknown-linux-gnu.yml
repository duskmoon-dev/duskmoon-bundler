name: Native aarch64-unknown-linux-gnu
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-target-aarch64-unknown-linux-gnu-${{ inputs.version }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/native-prebuild.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
      target: aarch64-unknown-linux-gnu
      runner: ubuntu-26.04
      use_cross: true
      quickbeam_target: 'aarch64-linux-gnu'
