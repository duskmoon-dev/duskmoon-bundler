name: Toolchain Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Toolchain Release]
    types: [completed]
  workflow_call:
    inputs:
      version:
        description: Already-published stable cohort to test
        required: true
        type: string
      source_sha:
        description: Immutable artifact source SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: toolchain-tests-${{ github.event_name }}-${{ github.event.workflow_run.id || inputs.version || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' && github.event_name != 'workflow_call' }}
jobs:
  test:
    if: github.event_name != 'workflow_run' && inputs.version == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DUSKMOON_NATIVE_MODE: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
      - name: Release, package, workflow and native-policy contracts
        run: |
          elixir .github/scripts/release_test.exs
          elixir .github/scripts/workflow_checks_test.exs
          elixir scripts/upgrade-ui-test.exs
          elixir scripts/package-stage-test.exs
          elixir scripts/native-policy-test.exs
          elixir scripts/native-url-test.exs
          elixir .github/scripts/native_download_support_test.exs
      - name: Compile source dependencies for native download regressions
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors
      - run: elixir scripts/native-download-failure-test.exs
      - run: elixir .github/scripts/cache_lazy_html_test.exs
      - name: Hologram Mocha suite under Bun and asset dependency setup
        run: MIX_ENV=dev mix test.js
      - name: All sub-app Elixir tests including Hologram
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          MIX_ENV: test
        run: mix test --timeout 300000
      - run: bun test test/js
  published-context:
    if: inputs.version != '' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.context.outputs.version }}
      source_sha: ${{ steps.context.outputs.source_sha }}
      current_cohort: ${{ steps.context.outputs.current_cohort }}
      release_run: ${{ steps.context.outputs.release_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - name: Resolve the successful publication or explicit verification request
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: elixir .github/scripts/test_release_context.exs
  public-artifacts:
    defaults:
      run:
        working-directory: source
    env:
      DUSKMOON_NATIVE_MODE: precompiled
    needs: published-context
    if: needs.published-context.outputs.version != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.published-context.outputs.source_sha }}
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: validation
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - name: Download and hash the complete public native cohort
        id: reuse
        env:
          VERSION: ${{ needs.published-context.outputs.version }}
          SOURCE_SHA: ${{ needs.published-context.outputs.source_sha }}
        run: elixir "$GITHUB_WORKSPACE/validation/.github/scripts/reuse_release.exs" "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/verified-native-assets"
      - name: Reject unpublished or incomplete native artifacts
        env:
          REUSABLE: ${{ steps.reuse.outputs.reusable }}
        run: test "$REUSABLE" = true
      - name: Verify public provenance and every release Hex tarball
        env:
          VERSION: ${{ needs.published-context.outputs.version }}
          SOURCE_SHA: ${{ needs.published-context.outputs.source_sha }}
        run: |
          cat > "$RUNNER_TEMP/verify-public-packages.exs" <<'ELIXIR'
          version = ReleaseSupport.stable!(System.fetch_env!("VERSION"))
          sha = ReleaseSupport.checked_head!(System.fetch_env!("SOURCE_SHA"))
          cohort = ReleaseSupport.cohort(version)
          ReleaseSupport.manifests!("apps", cohort, version)
          output = Path.join(System.fetch_env!("RUNNER_TEMP"), "verified-hex-packages")
          File.mkdir!(output)
          provenance = Path.join(output, "release-provenance.json")
          ReleaseSupport.http!(
            "https://github.com/duskmoon-dev/duskmoon-bundler/releases/download/v#{version}/release-provenance.json",
            provenance
          )
          state = JSON.decode!(File.read!(provenance))
          for {key, expected} <- [
                {"version", version}, {"source_sha", sha},
                {"mix_lock_sha256", ReleaseSupport.digest("mix.lock")},
                {"bun_lock_sha256", ReleaseSupport.digest("bun.lock")}
              ] do
            unless Map.fetch!(state, key) == expected,
              do: raise("public provenance mismatch: #{key}")
          end
          unless ReleaseSupport.reusable_native?(state),
            do: raise("public provenance lacks all 47 native artifacts")
          tarballs = Map.fetch!(state, "package_tarballs")
          unless Enum.sort(Map.keys(tarballs)) == Enum.sort(cohort) and
                   Enum.sort(Map.fetch!(state, "package_order")) == Enum.sort(cohort),
            do: raise("public provenance package cohort mismatch")
          for app <- cohort do
            expected = Map.fetch!(tarballs, app)
            unless is_binary(expected) and expected =~ ~r/^[a-f0-9]{64}$/,
              do: raise("invalid published package digest: #{app}")
            File.mkdir_p!(Path.join(output, app))
            tarball = Path.join([output, app, "#{app}-#{version}.tar"])
            ReleaseSupport.http!("https://repo.hex.pm/tarballs/#{app}-#{version}.tar", tarball)
            ReleaseSupport.immutable_action(ReleaseSupport.digest(tarball), expected)
          end
          File.write!(Path.join(output, "manifest.json"), JSON.encode!(%{version: version, source_sha: sha, packages: Enum.map(cohort, &%{name: &1})}))
          IO.puts("Verified all #{length(cohort)} public Hex package bytes for #{version} at #{sha}")
          ELIXIR
          elixir -r "$GITHUB_WORKSPACE/validation/.github/scripts/release_support.exs" "$RUNNER_TEMP/verify-public-packages.exs"
      - name: Exact published tarball consumer and runtime-only regression
        if: needs.published-context.outputs.current_cohort == 'true'
        env:
          VERSION: ${{ needs.published-context.outputs.version }}
          MIX_ENV: test
        run: |
          elixir "$GITHUB_WORKSPACE/validation/.github/scripts/prepare_tar_consumer.exs" "$RUNNER_TEMP/verified-hex-packages" "$RUNNER_TEMP/consumer-packages"
          elixir "$GITHUB_WORKSPACE/validation/scripts/package-consumer-smoke.exs" --stage "$RUNNER_TEMP/consumer-packages" --mode precompiled
          elixir "$GITHUB_WORKSPACE/validation/.github/scripts/runtime_consumer.exs" "$VERSION" "$RUNNER_TEMP/consumer-packages"
  published-native-downloads:
    name: published-native-downloads / ${{ matrix.runner }}
    needs: published-context
    if: needs.published-context.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-26-intel, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '28.5.0.8'
      - name: Execute all six NIFs from exact published packages without source compilers
        env:
          VERSION: ${{ needs.published-context.outputs.version }}
        run: elixir .github/scripts/native_download_probe.exs published "$VERSION"
  registry:
    needs: published-context
    if: needs.published-context.outputs.version != ''
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    timeout-minutes: 25
    steps:
      - name: Install registry consumer dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git libssl-dev unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        env:
          ImageOS: ubuntu26
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - name: Cold registry glibc consumer without source compilers
        env:
          VERSION: ${{ needs.published-context.outputs.version }}
        run: |
          ln -s "$GITHUB_WORKSPACE/.github/scripts" /validation
          sh /validation/alpine_native_smoke.sh "$VERSION"
  musl:
    needs: published-context
    if: needs.published-context.outputs.version != ''
    uses: ./.github/workflows/alpine-native-smoke.yml
    with:
      version: ${{ needs.published-context.outputs.version }}
      source_sha: ${{ github.sha }}
  verified-release:
    needs: [published-context, public-artifacts, published-native-downloads, registry, musl]
    if: needs.published-context.outputs.version != ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: toolchain
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - name: Record verified standalone release gates
        working-directory: toolchain
        env:
          VERSION: ${{ needs.published-context.outputs.version }}
          SOURCE_SHA: ${{ needs.published-context.outputs.source_sha }}
          VALIDATION_SHA: ${{ github.sha }}
          RELEASE_RUN: ${{ needs.published-context.outputs.release_run }}
          VERIFICATION_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          elixir -r .github/scripts/release_support.exs -e 'File.write!("verified-release.json", JSON.encode!(%{version: System.fetch_env!("VERSION"), source_sha: System.fetch_env!("SOURCE_SHA"), validation_sha: System.fetch_env!("VALIDATION_SHA"), release_run: System.fetch_env!("RELEASE_RUN"), verification_run: System.fetch_env!("VERIFICATION_RUN"), packages: ReleaseSupport.cohort(System.fetch_env!("VERSION")), public_assets_verified: true, native_download_consumers_verified: true, registry_consumer_verified: true, musl_amd64_verified: true, musl_arm64_verified: true}))'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verified-toolchain-release-v${{ needs.published-context.outputs.version }}
          path: toolchain/verified-release.json
          overwrite: true
