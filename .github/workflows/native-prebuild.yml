name: Build one native target
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      target:
        required: true
        type: string
      runner:
        required: true
        type: string
      use_cross:
        required: true
        type: boolean
      quickbeam_target:
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: native-build-${{ inputs.target }}-${{ inputs.version }}-${{ github.run_id }}
  cancel-in-progress: false
env:
  DUSKMOON_NATIVE_MODE: source
defaults:
  run:
    shell: bash
jobs:
  rust-nifs:
    name: ${{ matrix.crate.app }} / ${{ matrix.crate.name }} / ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crate:
          - app: duskmoon_oxc
            name: oxc_ex_nif
            project-dir: apps/duskmoon_oxc/native/oxc_ex_nif
          - app: duskmoon_oxc
            name: oxc_fmt_nif
            project-dir: apps/duskmoon_oxc/native/oxc_fmt_nif
          - app: duskmoon_oxc
            name: oxc_lint_nif
            project-dir: apps/duskmoon_oxc/native/oxc_lint_nif
          - app: duskmoon_oxide
            name: oxide_ex_nif
            project-dir: apps/duskmoon_oxide/native/oxide_ex_nif
          - app: duskmoon_vize
            name: vize_ex_nif
            project-dir: apps/duskmoon_vize/native/vize_ex_nif
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ inputs.target }}

      - name: Build Rust NIF
        id: build-crate
        uses: philss/rustler-precompiled-action@67ed0cc2d6a423e4c4cd9ad651dcc6c90f802cdb # v1.1.5
        env:
          CARGO_TARGET_DIR: target
          # musl defaults to static CRT, which cannot produce a loadable cdylib.
          # Target-specific flags also pass through cross without changing host builds.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: '-C target-feature=-crt-static'
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: '-C target-feature=-crt-static'
        with:
          project-name: ${{ matrix.crate.name }}
          project-version: ${{ inputs.version }}
          target: ${{ inputs.target }}
          nif-version: '2.15'
          use-cross: ${{ inputs.use_cross }}
          cross-version: from-source
          project-dir: ${{ matrix.crate.project-dir }}

      - name: Verify musl shared library
        if: endsWith(inputs.target, '-linux-musl')
        env:
          ARTIFACT: ${{ steps.build-crate.outputs.file-path }}
        run: |
          set -euo pipefail

          inspect_dir="$(mktemp -d)"
          trap 'rm -rf "${inspect_dir}"' EXIT
          tar xzf "${ARTIFACT}" -C "${inspect_dir}"
          library="$(find "${inspect_dir}" -name '*.so' -type f -print -quit)"
          readelf -h "${library}" | grep -Eq 'Type: +DYN'
          readelf -d "${library}" > "${inspect_dir}/dynamic"
          grep -Eq 'NEEDED.*\[libc\.so\]' "${inspect_dir}/dynamic"
          if grep -Eq 'NEEDED.*\[libc\.so\.6\]' "${inspect_dir}/dynamic"; then
            echo "musl NIF unexpectedly links against glibc" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.crate.name }}-${{ inputs.target }}
          path: ${{ steps.build-crate.outputs.file-path }}
          if-no-files-found: error
          overwrite: true

  quickbeam-nif:
    name: duskmoon_quickbeam / ${{ inputs.quickbeam_target }}
    if: inputs.quickbeam_target != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Install Zig
        uses: jdx/mise-action@v5.2.2
        with:
          tool_versions: |
            zig 0.16.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Elixir dependencies
        run: mix deps.get --check-locked

      - name: Build QuickBEAM NIF
        working-directory: apps/duskmoon_quickbeam
        env:
          QUICKBEAM_BUILD: '1'
          DUSKMOON_BUILD_NATIVE_FROM_SOURCE: '1'
        run: |
          # Keep same-host GNU Linux builds from inheriting the runner's CPU
          # features. Cross-target builds must let Zigler perform host sema
          # before it applies the requested target to the final artifact.
          case "${{ inputs.quickbeam_target }}" in
            x86_64-linux-gnu) export TARGET_ARCH=x86_64 ;;
            aarch64-linux-gnu) export TARGET_ARCH=aarch64 ;;
          esac
          if [[ "${{ inputs.quickbeam_target }}" == *-linux-gnu ]]; then
            export TARGET_OS=linux
            export TARGET_ABI=gnu
          fi

          mix zigler_precompiled.build lib/quickbeam/native.ex \
            --target ${{ inputs.quickbeam_target }} \
            --version ${{ inputs.version }} \
            --out ../../artifacts

      - name: Verify portable x86_64 instruction baseline
        if: startsWith(inputs.quickbeam_target, 'x86_64-linux-')
        run: |
          set -euo pipefail

          inspect_dir="$(mktemp -d)"
          trap 'rm -rf "${inspect_dir}"' EXIT

          tar xzf artifacts/Elixir.QuickBEAM.Native-v${{ inputs.version }}-${{ inputs.quickbeam_target }}.so.tar.gz \
            -C "${inspect_dir}"
          native_libraries=("${inspect_dir}"/Elixir.QuickBEAM.Native*.so)
          if [[ "${#native_libraries[@]}" -ne 1 || ! -f "${native_libraries[0]}" ]]; then
            echo "Expected exactly one QuickBEAM shared library in the native archive" >&2
            exit 1
          fi
          objdump -d "${native_libraries[0]}" > "${inspect_dir}/disassembly"

          if grep -Eq '%[yz]mm' "${inspect_dir}/disassembly"; then
            echo "QuickBEAM x86_64 artifact contains AVX or AVX-512 instructions" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: native-quickbeam-${{ inputs.quickbeam_target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          overwrite: true
