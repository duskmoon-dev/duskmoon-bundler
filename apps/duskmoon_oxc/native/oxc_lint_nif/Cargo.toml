[package]
name = "oxc_lint_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "oxc_lint_nif"
crate-type = ["cdylib"]

[workspace]

[dependencies]
rustler = { version = "0.38", default-features = false, features = ["derive", "nif_version_2_15"] }
oxc_linter = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.157.0" }
oxc_allocator = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.157.0" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.157.0" }
oxc_parser = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.157.0" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.157.0", features = ["cfg", "linter"] }
oxc_span = { git = "https://github.com/oxc-project/oxc", tag = "crates_v0.157.0" }
serde_json = "1"
